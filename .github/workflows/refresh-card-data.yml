# Watches optcgapi for cards the app does not have yet.
#
# OP-17 "The World's Strongest Warriors" releases 2026-08-22 (JP) / 2026-08-28
# (EN), and optcgapi only carries a set once it is out. Rather than check by hand
# every morning, this does it — and opens a PR the day something new appears.
#
# Deliberately a fixed window: the guard job below stops the work after
# 2026-09-10, but it cannot unschedule itself, so delete this file then.
name: Refresh card data

on:
  schedule:
    # 06:00 UTC. GitHub may run a scheduled job late under load; nothing here
    # cares which hour of the day it lands in.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  window:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - id: check
        # ISO dates compare correctly as strings, so no date maths is needed.
        run: |
          if [[ "$(date -u +%F)" > "2026-09-10" ]]; then
            echo "Past 2026-09-10. This workflow has done its job — delete it."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: window
    if: needs.window.outputs.open == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails loudly if optcgapi is unreachable or answers with an error. A card
      # catalog is not something to guess at, so a failed fetch must not quietly
      # produce an empty or half-written result.
      - name: Fetch the latest card data
        run: npm run data:leaders

      - id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          else
            echo "Catalog unchanged."
          fi

      # Most days end here, with no branch, no PR and no notification.
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/card-refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "data: refresh the leader catalog from optcgapi"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "data: new cards from optcgapi" \
            --body "$(cat <<'BODY'
          optcgapi is serving leader cards this app does not have. Generated by
          `.github/workflows/refresh-card-data.yml`; review the diff to `src/db/seed-data.ts`
          to see which leaders and metas are new.

          New leaders reach the app only once they are inserted, and that is not
          part of the deploy:

          - [ ] Merge
          - [ ] Deploy
          - [ ] Run `npm run db:seed` against production

          The seed is additive and idempotent — it skips every set code already
          present — so it is safe to re-run and it touches no logged tournament.
          BODY
          )"
